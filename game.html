<section class="page-top" id="game">
  <div class="wrap">
    <p class="label rv">GAME</p>
    <h1 class="rv d1 h2">資料館のミニゲーム</h1>
    <p class="lead rv d2">シマ先生とコトニちゃんと、ちょっとひと休み。</p>

    <div class="tabs rv" role="tablist" id="gameTabs" style="margin-bottom:20px">
      <span class="pill"></span>
      <button class="tab" role="tab" aria-selected="true" data-panel="gQuiz">なぜなぜクイズ</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="gHit">反射ゲーム</button>
    </div>

    <div class="panel game-card" id="gQuiz">
      <div id="quizBox">
        <div class="g-intro">
          <div class="talk"><img src="images/chars/kotoni_face2.png" alt="コトニちゃん"><p class="bubble">べつに、あなたがどれくらい知ってるか気になるわけじゃないけど……動画に出てきた「なぜ？」、答えられる？</p></div>
          <p class="note" id="quizCount">問題を読みこんでいます…</p>
          <div class="q-pick">
            <button class="q-cat main" data-ch="main" disabled><span class="tag">スポーツ編</span><b>プロ野球・MLB・サッカーの「なぜ？」</b><small id="qcMain"></small></button>
            <button class="q-cat jiji" data-ch="jiji" disabled><span class="tag">時事・地域編</span><b>ニュースと地域の「なぜ？」</b><small id="qcJiji"></small></button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel game-card" id="gHit" hidden>
      <div class="hit-top">
        <span>のこり <b id="hitTime">30</b>秒</span>
        <span>点数 <b id="hitScore">0</b></span>
        <span class="note">自己ベスト <b id="hitBest">0</b></span>
      </div>
      <p class="hit-rule"><img src="images/chars/shima_face1.png" alt=""> シマ先生が出たらタップ（＋1）　<img src="images/chars/kotoni_face1.png" alt=""> コトニちゃんはタップしない（−1）</p>
      <div class="board" id="hitBoard">
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
        <button class="hole" aria-label="棚"><img alt="" src="images/chars/shima_face1.png"></button>
      </div>
      <div id="hitMsg" hidden></div>
      <button class="btn solid" id="hitStart">スタート <span class="arr">→</span></button>
    </div>
  </div>
