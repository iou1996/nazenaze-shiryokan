name: update-videos
on:
  # 動画はたいてい前日の夕方に上がるので、深夜に取る（本人 2026-11-08「深夜がいいな」）。
  # GitHub の定時実行は混むと遅れたり飛ばされたりする（2026-11-08 は朝6時の分が来なかった）ので、3回。ちょうどの時刻（:00）は避ける。
  # 変わりがなければコミットしないので、何回走っても同じ
  schedule:
    - cron: "7 15 * * *"   # 日本時間 0:07
    - cron: "7 17 * * *"   # 日本時間 2:07
    - cron: "7 20 * * *"   # 日本時間 5:07
  workflow_dispatch:
concurrency:
  group: update-videos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_videos.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos.json news.html sitemap.xml
          git diff --cached --quiet || git commit -m "動画一覧を更新"
          git pull --rebase --quiet
          git push
