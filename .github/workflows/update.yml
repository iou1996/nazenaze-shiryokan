name: update-videos
on:
  # GitHub の定時実行は混むと何時間も遅れたり、飛ばされたりする（2026-11-08、朝6時の分が8時になっても来なかった）。
  # 1日3回にして、ちょうどの時刻（:00）を避ける。変わりがなければコミットしないので、何回走っても同じ
  schedule:
    - cron: "7 20 * * *"   # 日本時間 5:07
    - cron: "37 21 * * *"  # 日本時間 6:37
    - cron: "7 3 * * *"    # 日本時間 12:07
  workflow_dispatch:
concurrency:
  group: update-videos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_videos.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add videos.json news.html sitemap.xml
          git diff --cached --quiet || git commit -m "動画一覧を更新"
          git pull --rebase --quiet
          git push
